name: Deploy AtlantisJobs to Vercel & Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Pull Vercel Environment Information
        run: vercel env pull .env.production.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build Vercel Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_BSC_RPC_URL: https://bsc-dataseed.binance.org/
          NEXT_PUBLIC_DESTINATION_WALLET: '0xe2f8d466ba2031335d1291bc058d85aa050114ec'
          NEXT_PUBLIC_USDT_CONTRACT_ADDRESS: '0x55d398326f99059ff775485246999027b3197955'

      - name: Deploy Pre-built Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true
